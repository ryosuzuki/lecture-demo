<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three Ways to See Learning</title><style>*{box-sizing:border-box}body{margin:0;background:#071726;color:#d7e7f2;font:15px system-ui}nav{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;border-bottom:1px solid #335063}button,a{font:inherit;border:1px solid #3a596f;padding:8px 12px;border-radius:7px;background:#183347;color:#e2edf4;text-decoration:none;cursor:pointer}button.active{background:#36cfb5;color:#05261f;font-weight:700}iframe{border:0;width:100%;height:calc(100vh - 58px);display:none}iframe.active{display:block}span{color:#a3bdcd}a{margin-left:auto}@media(max-width:700px){iframe{height:85vh}}</style><nav><span>Compare learning views:</span><button data-id="layers">A · Inside the Layers</button><button data-id="landscape">B · Downhill on Loss</button><button data-id="story" class="active">C · One Sentence</button><a href="../walkthroughs/" target="_blank">Watch demonstrations ↗</a></nav><iframe id="layers" data-src="../train-layers/" title="Layer model"></iframe><iframe id="landscape" data-src="../train-landscape/" title="Loss landscape"></iframe><iframe id="story" src="../train-story/" class="active" title="Sentence lesson"></iframe><script>const buttons=[...document.querySelectorAll('button')];function show(id){if(!document.getElementById(id))id='story';buttons.forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.querySelectorAll('iframe').forEach(f=>{f.classList.toggle('active',f.id===id);if(f.id===id&&!f.src)f.src=f.dataset.src});history.replaceState(null,'','#'+id)}buttons.forEach(b=>b.onclick=()=>show(b.dataset.id));if(location.hash)show(location.hash.slice(1));</script></html>
