<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch the Demos</title><style>*{box-sizing:border-box}body{background:#0a1928;color:#e5f2f7;margin:30px auto;padding:0 20px;max-width:1400px;font:17px system-ui}h1{margin-bottom:8px}p{color:#adc3d4;line-height:1.6}a{color:#58dbc4}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}article{padding:18px;background:#112b3e;border:1px solid #36536a;border-radius:12px}video{width:100%;background:black;aspect-ratio:1.44;border-radius:8px}h2{font-size:21px}button{font:inherit}small{color:#adc3d4}@media(max-width:800px){main{grid-template-columns:1fr}}</style><h1>Watch, Then Try</h1><p>Actual browser recordings · English on-screen explanations · no audio.<br>Choose a learning view, or see how to teach the other labs. <a href="../">Open the interactive lab →</a></p><main id="videos"></main><script>fetch('videos.json').then(r=>r.json()).then(v=>{document.querySelector('#videos').innerHTML=v.map(x=>`<article><h2>${x.title}</h2><p>${x.question}</p><video controls preload="metadata" playsinline src="${x.video}"></video><p><a href="${x.app}">Try this demo ↗</a> · <a href="${x.script}">Instructor script</a></p></article>`).join('')})</script></html>
