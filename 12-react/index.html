<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReAct Agent Demo (OpenAI API)</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #101827;
      --panel2: #0f172a;
      --text: #e5e7eb;
      --muted: #a1a1aa;
      --border: #24314a;
      --thought: #f59e0b;
      --action: #22d3ee;
      --observation: #22c55e;
      --final: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 20% 0%, #0f1b38, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    header {
      padding: 16px 16px 0;
      max-width: 1400px;
      margin: 0 auto;
    }
    header h1 { font-size: 20px; margin-bottom: 4px; }
    header p { color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px 16px;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 14px;
    }
    @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
    .panel {
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(16,24,39,0.85), rgba(15,23,42,0.85));
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; }
    textarea { resize: vertical; min-height: 60px; }
    button {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .samples { display: flex; flex-wrap: wrap; gap: 6px; }
    .samples button {
      background: rgba(59,130,246,0.15);
      border: 1px solid var(--border);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 400;
      border-radius: 6px;
    }
    .samples button:hover { background: rgba(59,130,246,0.3); }
    #trace {
      flex: 1;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .step {
      border: 1px solid var(--border);
      background: var(--panel2);
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .step .label {
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .step.thought { border-left: 3px solid var(--thought); }
    .step.thought .label { color: var(--thought); }
    .step.action { border-left: 3px solid var(--action); }
    .step.action .label { color: var(--action); }
    .step.observation { border-left: 3px solid var(--observation); }
    .step.observation .label { color: var(--observation); }
    .step.final { border-left: 3px solid var(--final); }
    .step.final .label { color: var(--final); }
    .step.error { border-left: 3px solid #ef4444; }
    .step.error .label { color: #ef4444; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>🧠 ReAct Agent Playground</h1>
  <p>Thought → Action → Observation loop powered by OpenAI. The agent can search Wikipedia and use a calculator.</p>
</header>

<main>
  <div class="panel">
    <h2>Settings</h2>
    <div>
      <label>OpenAI API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." />
    </div>
    <div>
      <label>Model</label>
      <select id="model">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
        <option value="gpt-4o">gpt-4o</option>
        <option value="gpt-4.1-mini">gpt-4.1-mini</option>
        <option value="gpt-4.1-nano">gpt-4.1-nano</option>
      </select>
    </div>
    <div>
      <label>Question</label>
      <textarea id="question" rows="3" placeholder="Ask something...">What is the population of France, and what is that number divided by 7?</textarea>
    </div>
    <button id="runBtn" onclick="run()">▶ Run Agent</button>
    <div>
      <label>Sample Questions</label>
      <div class="samples">
        <button onclick="setQ(this.textContent)">What is the population of France, and what is that number divided by 7?</button>
        <button onclick="setQ(this.textContent)">Who wrote the novel 1984 and when were they born?</button>
        <button onclick="setQ(this.textContent)">What is the height of Mount Everest in feet? Convert it to meters.</button>
        <button onclick="setQ(this.textContent)">What country has the largest GDP and what is its capital?</button>
        <button onclick="setQ(this.textContent)">How old was Albert Einstein when he published his theory of special relativity?</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Agent Trace</h2>
    <div id="trace"><div style="color:var(--muted)">Enter your API key and click Run to start.</div></div>
  </div>
</main>

<script>
const SYSTEM_PROMPT = `You are a ReAct agent. You solve questions by interleaving Thought and Action steps.

You have access to these tools:
1. Wikipedia[query] — Search Wikipedia for a topic. Returns a summary.
2. Calculate[expression] — Evaluate a math expression. Use standard operators: + - * / ** ( )

STRICT FORMAT — follow this exactly for every turn:

Thought: <your reasoning about what to do next>
Action: <ToolName>[<input>]

Then STOP. Do NOT write "Observation:" — the system will provide it.

When you have the final answer, write:

Thought: I now have all the information needed.
Action: Finish[<your final answer>]

Rules:
- ONE Thought and ONE Action per turn.
- Always Thought before Action.
- Never fabricate observations.
- Keep thoughts concise.`;

function setQ(t) { document.getElementById('question').value = t; }

function addStep(type, text) {
  const trace = document.getElementById('trace');
  const div = document.createElement('div');
  div.className = 'step ' + type;
  const labels = { thought: '💭 Thought', action: '⚡ Action', observation: '👁 Observation', final: '✅ Final Answer', error: '❌ Error' };
  div.innerHTML = `<div class="label">${labels[type] || type}</div>${escHtml(text)}`;
  trace.appendChild(div);
  trace.scrollTop = trace.scrollHeight;
  return div;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// --- Wikipedia Search ---
async function wikiSearch(query) {
  try {
    // Try direct summary first
    const title = query.trim().replace(/\s+/g, '_');
    const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    let resp = await fetch(summaryUrl, { headers: { 'Api-User-Agent': 'ReActDemo/1.0' } });
    if (resp.ok) {
      const data = await resp.json();
      if (data.extract) return data.extract.slice(0, 500);
    }
    // Fallback: search API
    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&srlimit=1&utf8=1&origin=*`;
    resp = await fetch(searchUrl);
    const sData = await resp.json();
    const results = sData?.query?.search;
    if (!results || results.length === 0) return `No Wikipedia results found for "${query}".`;
    const pageTitle = results[0].title.replace(/\s+/g, '_');
    const sumUrl2 = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle)}`;
    resp = await fetch(sumUrl2, { headers: { 'Api-User-Agent': 'ReActDemo/1.0' } });
    if (resp.ok) {
      const d2 = await resp.json();
      if (d2.extract) return d2.extract.slice(0, 500);
    }
    return `Found "${results[0].title}" but could not retrieve summary.`;
  } catch (e) {
    return `Wikipedia search error: ${e.message}`;
  }
}

// --- Calculator ---
function calculate(expr) {
  try {
    // Safe math eval — only allow numbers, operators, parens, whitespace, decimal
    const clean = expr.replace(/\s/g, '');
    if (!/^[\d+\-*/().%e^]+$/i.test(clean)) return `Invalid expression: ${expr}`;
    // Replace ^ with **
    const jsExpr = clean.replace(/\^/g, '**');
    const result = Function('"use strict"; return (' + jsExpr + ')')();
    return String(result);
  } catch (e) {
    return `Calculation error: ${e.message}`;
  }
}

// --- Execute tool ---
async function executeTool(toolName, toolInput) {
  const name = toolName.trim().toLowerCase();
  if (name === 'wikipedia') return await wikiSearch(toolInput);
  if (name === 'calculate') return calculate(toolInput);
  if (name === 'finish') return null; // signals done
  return `Unknown tool: ${toolName}. Available: Wikipedia, Calculate, Finish`;
}

// --- Parse LLM response ---
function parseResponse(text) {
  let thought = '', action = '', toolName = '', toolInput = '';
  const tMatch = text.match(/Thought:\s*(.*?)(?=\nAction:|$)/s);
  if (tMatch) thought = tMatch[1].trim();
  const aMatch = text.match(/Action:\s*(\w+)\[([^\]]*)\]/s);
  if (aMatch) {
    toolName = aMatch[1];
    toolInput = aMatch[2];
    action = `${aMatch[1]}[${aMatch[2]}]`;
  }
  return { thought, action, toolName, toolInput };
}

// --- Main loop ---
async function run() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('Please enter your OpenAI API key.'); return; }
  const model = document.getElementById('model').value;
  const question = document.getElementById('question').value.trim();
  if (!question) { alert('Please enter a question.'); return; }

  const trace = document.getElementById('trace');
  trace.innerHTML = '';
  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Running...';

  const messages = [
    { role: 'system', content: SYSTEM_PROMPT },
    { role: 'user', content: question }
  ];

  const MAX_STEPS = 10;
  try {
    for (let i = 0; i < MAX_STEPS; i++) {
      // Show spinner
      const spinnerDiv = addStep('thought', '');
      spinnerDiv.innerHTML = '<div class="spinner"></div> Thinking...';

      // Call OpenAI
      const resp = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model, messages, stop: ['Observation:'], temperature: 0.2 })
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${resp.status}`);
      }
      const data = await resp.json();
      const reply = data.choices?.[0]?.message?.content || '';
      messages.push({ role: 'assistant', content: reply });

      // Remove spinner
      spinnerDiv.remove();

      // Parse
      const { thought, action, toolName, toolInput } = parseResponse(reply);
      if (thought) addStep('thought', thought);
      if (action) addStep('action', action);

      // Finish?
      if (toolName.toLowerCase() === 'finish') {
        addStep('final', toolInput);
        break;
      }

      if (!toolName) {
        // LLM didn't produce a valid action — show raw and stop
        if (!thought) addStep('error', 'No valid action parsed from response:\n' + reply);
        addStep('final', reply);
        break;
      }

      // Execute tool
      const observation = await executeTool(toolName, toolInput);
      if (observation === null) {
        addStep('final', toolInput);
        break;
      }
      addStep('observation', observation);
      messages.push({ role: 'user', content: `Observation: ${observation}` });
    }
  } catch (e) {
    addStep('error', e.message);
  }

  btn.disabled = false;
  btn.textContent = '▶ Run Agent';
}
</script>
</body>
</html>
